<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <!-- relativo ao <base> (evita /auditoria/auditoria/...). favicon pequeno = legível na aba -->
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=oficial3" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=oficial3" />
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=oficial3" />
    <link rel="preload" as="image" href="Simbolo_Meridian_Oficial.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#051017" />
    <meta name="description" content="Meridian — gestão financeira e operacional Grupo Alvim" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <link rel="apple-touch-icon" href="meridian-icon-192.png?v=oficial3" sizes="192x192" />
    <!-- manifest.webmanifest: injetado pelo Vite PWA só no build de produção -->
    <title>Meridian</title>
    <!-- Desktop: aplica o tema salvo. App (telefone): sempre claro, sem apagar a preferência do PC. -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isApp = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)
            || (window.matchMedia && window.matchMedia('(max-width: 899.95px)').matches);
          if (isApp) {
            document.documentElement.classList.remove('dark');
            return;
          }
          var m = localStorage.getItem('app-theme-mode');
          if (m === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #051017;
        transition: opacity 0.28s ease, visibility 0.28s;
      }
      #pwa-splash.pwa-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #pwa-splash img {
        /* vmin = menor lado da tela → escala em qualquer aparelho (S29, compactos, etc.) */
        width: clamp(5.5rem, 32vmin, 10.5rem);
        height: clamp(5.5rem, 32vmin, 10.5rem);
        object-fit: contain;
        animation: meridian-splash-mark 1.5s ease-in-out infinite;
      }
      @keyframes meridian-splash-mark {
        0%, 100% { transform: scale(0.96); opacity: 0.9; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #pwa-splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="pwa-splash" aria-hidden="true">
      <img src="Simbolo_Meridian_Oficial.png" alt="" decoding="sync" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script>
      /* Failsafe: se o bundle JS não subir, a splash não fica eterna. */
      (function () {
        function hide() {
          var el = document.getElementById('pwa-splash');
          if (!el || el.classList.contains('pwa-splash--hide')) return;
          el.classList.add('pwa-splash--hide');
          setTimeout(function () { try { el.remove(); } catch (e) {} }, 400);
        }
        setTimeout(hide, 5000);
        window.addEventListener('error', hide);
        window.addEventListener('unhandledrejection', hide);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
