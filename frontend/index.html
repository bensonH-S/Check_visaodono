<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <!-- relativo ao <base> (evita /auditoria/auditoria/...). favicon.png = 32px; PNG grande falha na aba -->
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3" />
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=3" />
    <link rel="preload" as="image" href="Logo_Alvim_Icone.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1B2A6B" />
    <meta name="description" content="Meridian — checklist, chamados e auditoria Grupo Alvim" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <link rel="apple-touch-icon" href="Logo_Alvim_Icone.png" sizes="192x192" />
    <!-- manifest.webmanifest: injetado pelo Vite PWA só no build de produção -->
    <title>Meridian</title>
    <!-- Aplica tema escuro imediatamente para evitar flash (antes do React) -->
    <script>
      (function() {
        try {
          var m = localStorage.getItem('app-theme-mode');
          if (m === 'dark') document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.28s ease, visibility 0.28s;
      }
      #pwa-splash.pwa-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #pwa-splash img {
        /* vmin = menor lado da tela → escala em qualquer aparelho (S29, compactos, etc.) */
        width: clamp(5.5rem, 32vmin, 10.5rem);
        height: clamp(5.5rem, 32vmin, 10.5rem);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="pwa-splash" aria-hidden="true">
      <img src="Logo_Alvim_Icone.png" alt="" decoding="sync" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
