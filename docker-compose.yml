services:
  app:
    container_name: vision-check
    build:
      context: .
      args:
        GIT_TAG: ${GIT_TAG:-}
    network_mode: host
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=3007
      - TZ=America/Sao_Paulo
      - WPP_HOST=http://127.0.0.1
      - WPP_PORT=21465
      - WPP_ENABLED=${WPP_ENABLED:-false}
      - WPP_WEBHOOK_URL=http://127.0.0.1:3007/auditoria/api/wpp/webhook
    volumes:
      - ./Logs:/app/Logs
      - ./uploads:/app/uploads
    restart: unless-stopped

  wppconnect:
    profiles: ["wpp-docker"]
    build:
      context: ./docker/wppconnect
    container_name: vision-check-wpp
    restart: "no"
    environment:
      - TZ=America/Sao_Paulo
      - PORT=21465
      - NODE_ENV=production
    expose:
      - "21465"
