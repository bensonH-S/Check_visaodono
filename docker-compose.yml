services:
  app:
    container_name: vision-check
    build:
      context: .
      args:
        GIT_TAG: ${GIT_TAG:-}
    ports:
      - "3007:3007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=3007
      - TZ=America/Sao_Paulo
      # WPP do host (/var/www/app/wppconnect-server) — o mesmo do PC. Chromium Alpine do container não gera QR.
      - WPP_HOST=http://host.docker.internal
      - WPP_PORT=21465
      - WPP_ENABLED=${WPP_ENABLED:-false}
      - WPP_WEBHOOK_URL=http://127.0.0.1:3007/auditoria/api/wpp/webhook
    volumes:
      - ./Logs:/app/Logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - meridian

  wppconnect:
    profiles: ["wpp-docker"]
    build:
      context: ./docker/wppconnect
    container_name: vision-check-wpp
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PORT=21465
      - NODE_ENV=production
      - WPP_SECRET_KEY=${WPP_SECRET_KEY:-THISISMYSECURETOKEN}
      - WPP_SESSION=${WPP_SESSION:-wpp_visao_check}
      - WPP_START_ALL_SESSION=false
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_userdata:/usr/src/wpp-server/userDataDir
    expose:
      - "21465"
    shm_size: "512mb"
    networks:
      - meridian

networks:
  meridian:
    name: vision-check-net

volumes:
  wppconnect_tokens:
  wppconnect_userdata:
