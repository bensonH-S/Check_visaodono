services:
  app:
    container_name: vision-check
    build:
      context: .
      args:
        GIT_TAG: ${GIT_TAG:-}
    ports:
      - "3007:3007"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=3007
      - TZ=America/Sao_Paulo
      # Sempre rede interna Docker — NÃO use localhost no .env em produção
      - WPP_HOST=http://wppconnect
      - WPP_PORT=21465
      - WPP_ENABLED=${WPP_ENABLED:-false}
    volumes:
      - ./Logs:/app/Logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - wppconnect
    networks:
      - meridian

  wppconnect:
    build:
      context: ./docker/wppconnect
    container_name: vision-check-wpp
    restart: unless-stopped
    # NÃO monte env_file: .env aqui — PORT=3007 do app faz o WPP subir na porta errada
    environment:
      - TZ=America/Sao_Paulo
      - PORT=21465
      - NODE_ENV=production
      - WPP_SECRET_KEY=${WPP_SECRET_KEY:-THISISMYSECURETOKEN}
      - WPP_SESSION=${WPP_SESSION:-wpp_visao_check}
      - WPP_START_ALL_SESSION=false
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_userdata:/usr/src/wpp-server/userDataDir
    expose:
      - "21465"
    shm_size: "512mb"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:21465',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s
    networks:
      - meridian

networks:
  meridian:
    name: vision-check-net

volumes:
  wppconnect_tokens:
  wppconnect_userdata:
